name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build FastDelete.sln -c Release --nologo

      - name: Test (48 xUnit)
        run: dotnet test FastDelete.sln -c Release --no-build --nologo
